services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: stocksense
      MYSQL_USER: ${MYSQL_USER:-stocksense}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-stocksense}
    ports: ["3307:3306"]
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./database/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
      - ./database/views.sql:/docker-entrypoint-initdb.d/03-views.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
  backend:
    build: ./backend
    environment:
      DATABASE_URL: mysql+pymysql://${MYSQL_USER:-stocksense}:${MYSQL_PASSWORD:-stocksense}@mysql:3306/stocksense
      ALLOWED_ORIGINS: http://localhost:5173,http://localhost:8080
    depends_on:
      mysql: { condition: service_healthy }
    ports: ["8000:8000"]
  frontend:
    build: ./frontend
    depends_on: [backend]
    ports: ["8080:80"]
volumes:
  mysql_data:
